<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InvoiceNest Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

      <div class="sidebar-logo">
        InvoiceNest
      </div>

      <nav class="sidebar-menu">

        <a href="#">Dashboard</a>
        <a href="#">Invoices</a>
        <a href="#">Clients</a>
        <a href="#">Payments</a>
        <a href="#">Settings</a>

      </nav>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

      <header class="topbar">

        <h1>Dashboard</h1>

        <button class="create-btn">
          + Create Invoice
        </button>

      </header>


      <!-- Stats Cards -->

      <section class="stats">

        <div class="stat-card">
          <h3>Total Revenue</h3>
          <p>$12,450</p>
        </div>

        <div class="stat-card">
          <h3>Paid Invoices</h3>
          <p>48</p>
        </div>

        <div class="stat-card">
          <h3>Pending Payments</h3>
          <p>12</p>
        </div>

        <div class="stat-card">
          <h3>Clients</h3>
          <p>24</p>
        </div>

      </section>


      <!-- Recent Invoices -->

      <section class="recent-invoices">

        <h2>Recent Invoices</h2>

        <table>

          <thead>
            <tr>
              <th>Client</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td>John Studio</td>
              <td>$320</td>
              <td class="paid">Paid</td>
            </tr>

            <tr>
              <td>Pixel Agency</td>
              <td>$850</td>
              <td class="pending">Pending</td>
            </tr>

            <tr>
              <td>Nova Tech</td>
              <td>$1,200</td>
              <td class="paid">Paid</td>
            </tr>

          </tbody>

        </table>

      </section>

    </main>

  </div>

</body>

</html>
