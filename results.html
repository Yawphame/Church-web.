<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Result</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fffc00;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:20px;
width:320px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

button{
background:black;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

#message{
margin-top:20px;
font-size:18px;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>💰 Conversion Successful</h1>

<h2 id="money"></h2>

<p>Ready to withdraw?</p>

<button onclick="prank()">
Withdraw Money
</button>

<div id="message"></div>

</div>

<script>

let score =
localStorage.getItem(
"snapscore"
);

let fakeMoney =
score * 14.7;

document.getElementById(
"money"
).innerText =
"$" +
fakeMoney.toLocaleString();

function prank(){

document.getElementById(
"message"
).innerHTML=
"😂 GOT YOU! Snap Scores don't turn into money.";

}

</script>

</body>
</html>
