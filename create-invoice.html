<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Invoice - InvoiceNest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-logo">
        InvoiceNest
      </div>

      <nav class="sidebar-menu">

        <a href="dashboard.html">Dashboard</a>

        <a href="invoices.html">Invoices</a>

        <a href="clients.html">Clients</a>

        <a href="settings.html">Settings</a>

      </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

      <!-- TOPBAR -->

      <header class="topbar">

        <div>

          <h1>Create Invoice</h1>

          <p class="topbar-text">
            Generate professional invoices for your clients.
          </p>

        </div>

      </header>


      <!-- FORM -->

      <section class="invoice-form-section">

        <form class="invoice-form">

          <div class="form-grid">

            <div class="input-group">

              <label>Client Name</label>

              <input type="text" placeholder="Enter client name">

            </div>


            <div class="input-group">

              <label>Client Email</label>

              <input type="email" placeholder="Enter client email">

            </div>


            <div class="input-group">

              <label>Invoice Amount</label>

              <input type="text" placeholder="$0.00">

            </div>


            <div class="input-group">

              <label>Due Date</label>

              <input type="date">

            </div>

          </div>


          <div class="input-group">

            <label>Services Description</label>

            <textarea placeholder="Describe the services provided..."></textarea>

          </div>


          <div class="input-group">

            <label>Invoice Status</label>

            <select>

              <option>Pending</option>

              <option>Paid</option>

              <option>Overdue</option>

            </select>

          </div>


          <button type="submit" class="save-settings-btn">
            Generate Invoice
          </button>

        </form>

      </section>

    </main>

  </div>

</body>

</html>
