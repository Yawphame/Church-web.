<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invoices - InvoiceNest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-logo">
        InvoiceNest
      </div>

      <nav class="sidebar-menu">

        <a href="dashboard.html">Dashboard</a>

        <a href="invoices.html" class="active-link">
          Invoices
        </a>

        <a href="clients.html">Clients</a>

        <a href="create-invoice.html">
          Create Invoice
        </a>

        <a href="settings.html">Settings</a>

      </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

      <header class="topbar">

        <div>

          <h1>Invoices</h1>

          <p class="topbar-text">
            All generated invoices appear here automatically.
          </p>

        </div>

        <a href="create-invoice.html" class="create-btn">
          + New Invoice
        </a>

      </header>


      <!-- TABLE SECTION -->

      <section class="invoice-table-section">

        <div class="table-header">

          <div>

            <h2>Saved Invoices</h2>

            <p>
              Your generated invoices are stored locally.
            </p>

          </div>

        </div>


        <table>

          <thead>

            <tr>

              <th>Client</th>

              <th>Email</th>

              <th>Amount</th>

              <th>Due Date</th>

              <th>Status</th>

            </tr>

          </thead>


          <tbody id="invoice-list">

          </tbody>

        </table>

      </section>

    </main>

  </div>


  <script src="script.js"></script>

</body>

</html>
