<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing...</title>

<style>

body{
margin:0;
font-family:Arial;
background:#fffc00;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
width:320px;
border-radius:25px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.2);
}

.loader{
width:100%;
height:20px;
background:#ddd;
border-radius:30px;
overflow:hidden;
margin:20px 0;
}

.progress{
height:100%;
width:0%;
background:black;
animation:load 4s forwards;
}

@keyframes load{
0%{width:0%;}
100%{width:100%;}
}

.hidden{
display:none;
}

button{
padding:12px 25px;
border:none;
background:black;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h1>💰 Converting...</h1>

<p>Calculating influencer bonus...</p>

<div class="loader">
<div class="progress"></div>
</div>

<div id="result" class="hidden">

<h2 id="money"></h2>

<p>Money ready for withdrawal</p>

<button onclick="prank()">
Withdraw
</button>

<p id="message"></p>

</div>

</div>

<script>

let score =
localStorage.getItem("snapscore");

let fakeMoney =
(score*14.7).toLocaleString();

setTimeout(()=>{

document.getElementById(
"result"
).classList.remove(
"hidden"
);

document.getElementById(
"money"
).innerHTML=
"$"+fakeMoney;

},4000);


function prank(){

document.getElementById(
"message"
).innerHTML=
"😂 GOT YOU! Snap Scores aren't money.";

}

</script>

</body>
</html>
